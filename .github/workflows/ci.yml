name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check public/app.js && node --check public/earth.js && node --check public/sw.js && node --check public/ambient.js && node --check public/scenes.js
      - run: python -m py_compile tools/deploy_ftp.py
      - run: npm audit --audit-level=high
      - name: Browser interaction checks
        run: |
          npx playwright install --with-deps chromium
          npm start > /tmp/timescreen-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node tools/qa-web.mjs
